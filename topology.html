<!DOCTYPE html>
<html lang="ru" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Редактор топологии щита</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { color-scheme: dark; }
  body { background:#0b0f1a; }
  .card { touch-action: none; }
  .card.dragging { opacity: 0.35; }
  .drop-zone.dragover { outline: 2px dashed #6366f1; outline-offset: -4px; }
</style>
</head>
<body class="text-slate-200 font-sans">

  <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 py-3 flex flex-wrap justify-between items-center gap-3">
      <div>
        <h1 class="text-lg font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-diagram-project"></i> Редактор топологии щита
        </h1>
        <p class="text-xs text-slate-400">3 щитка, в каждом — колонки L1/L2/L3. Тащи карточки между колонками (меняет линию) и между щитками (меняет панель), внутри колонки — меняешь порядок.</p>
      </div>
      <div class="flex items-center gap-2">
        <a href="index.html" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 text-sm">← Дашборд</a>
        <button onclick="saveTopology()" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-sm font-semibold">
          💾 Сохранить в schema_data.json
        </button>
      </div>
    </div>
    <div class="max-w-6xl mx-auto px-4 sm:px-6 pb-2">
      <p id="status" class="text-xs text-slate-500"></p>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 sm:px-6 py-5 space-y-5">
    <div id="panels" class="space-y-5"></div>
  </main>

<script>
  const SCHEMA_URL = 'schema_data.json?t=' + Date.now();
  const SAVE_URL = 'topology-save';

  // Три физических щитка (поле location), внутри каждого — 3 колонки по линиям L1/L2/L3
  // плюс отдельная строка сверху для узлов без конкретной фазы (3P: вводные автоматы,
  // АВР, генератор, QF1, QD1).
  const PANELS = [
    { key: 'street_panel_pre_ats', title: 'Щиток 1 — за домом (ДО АВР, не резервируется генератором)', accent: 'sky', rail: 0 },
    { key: null, title: 'Щиток 2 — в доме (после QF1/QD1)', accent: 'indigo', rail: 2 },
    { key: 'parking_subpanel', title: 'Щиток 3 — на парковке (питается от «Парковка», L1-08)', accent: 'amber', rail: 6 },
  ];
  const PHASES = ['L1', 'L2', 'L3'];

  const ACCENT = {
    sky: { border: 'border-sky-500/40', bg: 'bg-sky-950/15', text: 'text-sky-300' },
    indigo: { border: 'border-indigo-500/40', bg: 'bg-indigo-950/15', text: 'text-indigo-300' },
    amber: { border: 'border-amber-500/40', bg: 'bg-amber-950/15', text: 'text-amber-300' },
  };
  const PHASE_COLOR = {
    L1: { border: 'border-rose-500/30', text: 'text-rose-300' },
    L2: { border: 'border-emerald-500/30', text: 'text-emerald-300' },
    L3: { border: 'border-violet-500/30', text: 'text-violet-300' },
  };

  // Фиксированный физический порядок узлов "Общий ввод" — он не редактируется перетаскиванием
  // (это реальная проводка, она всегда одна и та же), только отображается стрелочками.
  const GENERAL_RANK = {
    'STREET-IN1': 1, 'STREET-ATS': 2, 'STREET-GEN': 3, 'STREET-IN2': 4,
    'DEV-MAIN-01': 5, 'DEV-RCD-01': 6,
  };

  let devices = [];
  let dirty = false;

  async function load() {
    const status = document.getElementById('status');
    try {
      const resp = await fetch(SCHEMA_URL, { cache: 'no-store' });
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      const data = await resp.json();
      devices = data.devices || [];
      status.textContent = 'Загружено ' + devices.length + ' узлов (данные от ' + (data.updated_at || '?') + ')';
      render();
    } catch (e) {
      status.textContent = 'Не удалось загрузить schema_data.json: ' + e.message;
      status.className = 'text-xs text-rose-400';
    }
  }

  function devicesOf(panel, phase) {
    // phase === null -> узлы без конкретной линии (3P: вводные, АВР, генератор, QF1, QD1)
    return devices
      .filter(d => (d.location || null) === panel.key && (phase ? d.phase === phase : (d.phase || '3P') === '3P'))
      .sort((a, b) => (a.din_position ?? 0) - (b.din_position ?? 0));
  }

  function render() {
    const root = document.getElementById('panels');
    root.innerHTML = '';
    PANELS.forEach((panel, i) => {
      root.appendChild(renderPanel(panel));
      if (i < PANELS.length - 1) root.appendChild(renderPanelConnector(panel, PANELS[i + 1]));
    });
  }

  function renderPanelConnector(fromPanel, toPanel) {
    const el = document.createElement('div');
    el.className = 'flex items-center justify-center gap-2 text-xs text-slate-500';
    const label = toPanel.key === 'parking_subpanel'
      ? 'питание ↓ через фидер «Парковка» (L1-08)'
      : 'питание ↓';
    el.innerHTML = `<span class="text-slate-600">┊</span><span>${label}</span><span class="text-slate-600">┊</span>`;
    return el;
  }

  function renderPanel(panel) {
    const ac = ACCENT[panel.accent];
    const wrap = document.createElement('div');
    wrap.className = `rounded-2xl border ${ac.border} ${ac.bg} p-4 space-y-3`;

    const total = devices.filter(d => (d.location || null) === panel.key).length;
    const title = document.createElement('h2');
    title.className = `font-bold ${ac.text}`;
    title.textContent = panel.title + ' (' + total + ')';
    wrap.appendChild(title);

    // Общий ввод — порядок фиксирован физикой (это всегда одна и та же проводка),
    // поэтому сортируем по известной последовательности и рисуем стрелочками, а не
    // даём перетаскиванием менять порядок внутри строки. Перетащить узел СЮДА из
    // другой колонки/щитка по-прежнему можно — это меняет щиток/линию, не порядок.
    const threeP = devicesOf(panel, null)
      .sort((a, b) => (GENERAL_RANK[a.id] ?? 99) - (GENERAL_RANK[b.id] ?? 99));
    const dropRow = document.createElement('div');
    dropRow.className = 'drop-zone rounded-xl border border-slate-700/50 bg-slate-900/30 p-2';
    dropRow.dataset.panel = panel.key ?? '';
    dropRow.dataset.phase = '';
    dropRow.dataset.general = '1';
    dropRow.ondragover = onDropZoneDragOver;
    dropRow.ondragleave = onDropZoneDragLeave;
    dropRow.ondrop = onDropZoneDrop;
    const dropRowLabel = document.createElement('div');
    dropRowLabel.className = 'text-[10px] text-slate-500 mb-1';
    dropRowLabel.textContent = 'Общий ввод (без конкретной линии)' + (threeP.length ? '' : ' — пусто');
    dropRow.appendChild(dropRowLabel);
    const dropRowList = document.createElement('div');
    dropRowList.className = 'flex flex-wrap items-center gap-1.5 min-h-[36px]';
    threeP.forEach((dev, i) => {
      if (i > 0) {
        const arrow = document.createElement('span');
        arrow.className = 'text-slate-600 text-xs flex-shrink-0';
        arrow.textContent = '→';
        dropRowList.appendChild(arrow);
      }
      dropRowList.appendChild(makeCard(dev));
    });
    dropRow.appendChild(dropRowList);
    wrap.appendChild(dropRow);

    const cols = document.createElement('div');
    cols.className = 'grid grid-cols-1 md:grid-cols-3 gap-2';
    PHASES.forEach(ph => cols.appendChild(renderPhaseColumn(panel, ph)));
    wrap.appendChild(cols);

    return wrap;
  }

  function renderPhaseColumn(panel, phase) {
    const pc = PHASE_COLOR[phase];
    const colDevs = devicesOf(panel, phase);

    const col = document.createElement('div');
    col.className = `drop-zone rounded-xl border ${pc.border} bg-slate-900/40 p-2 min-h-[80px]`;
    col.dataset.panel = panel.key ?? '';
    col.dataset.phase = phase;
    col.ondragover = onDropZoneDragOver;
    col.ondragleave = onDropZoneDragLeave;
    col.ondrop = onDropZoneDrop;

    const label = document.createElement('div');
    label.className = `text-xs font-bold ${pc.text} mb-1`;
    label.textContent = phase + ' (' + colDevs.length + ')';
    col.appendChild(label);

    const list = document.createElement('div');
    list.className = 'flex flex-wrap gap-1.5 min-h-[32px]';
    colDevs.forEach(dev => list.appendChild(makeCard(dev)));
    col.appendChild(list);
    return col;
  }

  function makeCard(dev) {
    const hasTelemetry = dev.type === 'smart_breaker_sy2';

    const el = document.createElement('div');
    el.className = 'card flex items-center gap-1.5 px-2 py-1.5 rounded-lg bg-slate-800 border border-slate-700 cursor-grab text-xs';
    el.draggable = true;
    el.dataset.id = dev.id;

    if (hasTelemetry) {
      const dot = document.createElement('span');
      dot.className = 'w-2 h-2 rounded-full flex-shrink-0 ' + (dev.state === 'OFF' ? 'bg-slate-600' : 'bg-emerald-400');
      el.appendChild(dot);
    }

    const name = document.createElement('span');
    name.className = 'truncate max-w-[150px] font-medium';
    name.title = dev.name + ' (' + dev.id + ')';
    name.textContent = dev.name;
    el.appendChild(name);

    el.addEventListener('dragstart', e => {
      e.dataTransfer.setData('text/plain', dev.id);
      el.classList.add('dragging');
    });
    el.addEventListener('dragend', () => el.classList.remove('dragging'));
    return el;
  }

  function onDropZoneDragOver(e) {
    e.preventDefault();
    e.currentTarget.classList.add('dragover');
    const list = e.currentTarget.querySelector('.flex');
    const dragging = document.querySelector('.card.dragging');
    if (!dragging) return;
    const afterEl = [...list.querySelectorAll('.card:not(.dragging)')].find(card => {
      const rect = card.getBoundingClientRect();
      return e.clientY < rect.top + rect.height / 2 ||
             (e.clientY < rect.bottom && e.clientX < rect.left + rect.width / 2);
    });
    if (afterEl) list.insertBefore(dragging, afterEl);
    else list.appendChild(dragging);
  }

  function onDropZoneDragLeave(e) {
    if (e.currentTarget === e.target) e.currentTarget.classList.remove('dragover');
  }

  function onDropZoneDrop(e) {
    e.preventDefault();
    const zone = e.currentTarget;
    zone.classList.remove('dragover');
    const id = e.dataTransfer.getData('text/plain');
    const dev = devices.find(d => d.id === id);
    if (!dev) return;

    const panelKey = zone.dataset.panel || null;
    const phase = zone.dataset.phase || null;
    const panel = PANELS.find(p => p.key === panelKey) || PANELS[1];

    if (panelKey) dev.location = panelKey; else delete dev.location;
    dev.din_rail = panel.rail;
    if (panelKey === 'parking_subpanel') dev.fed_by = dev.fed_by || 'L1-08';
    else delete dev.fed_by;
    dev.phase = phase || '3P';

    if (zone.dataset.general === '1') {
      // Общий ввод не переупорядочивается перетаскиванием — порядок всегда
      // фиксирован физикой проводки (см. GENERAL_RANK), только положение в нём.
      dev.din_position = GENERAL_RANK[dev.id] ?? 99;
    } else {
      const list = zone.querySelector('.flex');
      [...list.querySelectorAll('.card')].forEach((card, idx) => {
        const d = devices.find(x => x.id === card.dataset.id);
        if (d) d.din_position = idx + 1;
      });
    }

    markDirty();
    render();
  }

  function markDirty() {
    dirty = true;
    const status = document.getElementById('status');
    status.textContent = 'Есть несохранённые изменения — нажми «Сохранить в schema_data.json»';
    status.className = 'text-xs text-amber-400';
  }

  async function saveTopology() {
    const status = document.getElementById('status');
    status.textContent = 'Сохраняю...';
    status.className = 'text-xs text-slate-400';
    const payload = {
      devices: devices.map(d => ({
        id: d.id,
        phase: d.phase,
        din_rail: d.din_rail,
        din_position: d.din_position,
        location: d.location ?? null,
        fed_by: d.fed_by ?? null,
      })),
    };
    try {
      const resp = await fetch(SAVE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const result = await resp.json();
      if (!resp.ok || !result.ok) throw new Error(result.error || ('HTTP ' + resp.status));
      dirty = false;
      status.textContent = 'Сохранено (' + result.updated + ' узлов) — ' + new Date().toLocaleTimeString('ru-RU');
      status.className = 'text-xs text-emerald-400';
    } catch (e) {
      status.textContent = 'Ошибка сохранения: ' + e.message;
      status.className = 'text-xs text-rose-400';
    }
  }

  window.addEventListener('beforeunload', (e) => {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });

  load();
</script>
</body>
</html>
