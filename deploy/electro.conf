    # Электрощит дома — статика (мониторинг фаз Tuya SY2)
    location /electro/ {
        auth_basic "Электрощит дома";
        auth_basic_user_file /etc/nginx/.htpasswd-electro;
        alias /opt/projects/home-electrical-schema/;
        try_files $uri $uri/ /electro/index.html;
    }

    # Кнопка "Обновить" — ручной синк с Tuya Cloud (тот же basic-auth)
    location /electro/refresh {
        auth_basic "Электрощит дома";
        auth_basic_user_file /etc/nginx/.htpasswd-electro;
        proxy_pass http://127.0.0.1:8877/refresh;
        proxy_set_header Host $host;
    }
