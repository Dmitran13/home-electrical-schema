<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background:#090d16; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="l1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="l2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="l3Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Title -->
  <text x="600" y="45" fill="#f8fafc" font-size="22" font-weight="bold" text-anchor="middle">ОДНОЛИНЕЙНАЯ СХЕМА ЭЛЕКТРОСЕТИ И РАСПРЕДЕЛИТЕЛЬНОГО ЩИТА (3 ФАЗЫ)</text>
  <text x="600" y="70" fill="#94a3b8" font-size="13" text-anchor="middle">Щиток 2 (в доме) • Ввод TN-C-S 3P+N 15 кВт • 18 автоматов Tuya SY2 • данные на 2026-11-02</text>

  <!-- Grid Input Box -->
  <g transform="translate(50, 100)">
    <rect width="240" height="150" rx="10" fill="#1e293b" stroke="#475569" stroke-width="2"/>
    <text x="120" y="30" fill="#f1f5f9" font-size="14" font-weight="bold" text-anchor="middle">ВВОДНАЯ СЕТЬ (380/220В)</text>
    <line x1="20" y1="45" x2="220" y2="45" stroke="#334155" stroke-width="1"/>

    <text x="25" y="70" fill="#ef4444" font-size="12" font-weight="bold">L1: 201.4В (14.95A)</text>
    <text x="25" y="90" fill="#10b981" font-size="12" font-weight="bold">L2: 199.6В (1.91A)</text>
    <text x="25" y="110" fill="#8b5cf6" font-size="12" font-weight="bold">L3: 229.9В (0.41A)</text>
    <text x="25" y="130" fill="#38bdf8" font-size="11" font-weight="bold">Щиток 1 (до АВР): Роз Н/Роз В/ИБП ГАЗ</text>
  </g>

  <!-- Flow Arrow to Main Breaker -->
  <path d="M 290 175 L 340 175" stroke="#64748b" stroke-width="3" stroke-dasharray="4,4"/>

  <!-- Main Breakers & RCD -->
  <g transform="translate(340, 100)">
    <rect width="220" height="150" rx="10" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <text x="110" y="28" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">ВВОДНОЙ БЛОК ЗАЩИТЫ</text>
    <line x1="15" y1="40" x2="205" y2="40" stroke="#334155" stroke-width="1"/>

    <rect x="20" y="55" width="180" height="35" rx="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
    <text x="110" y="77" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">QF1: Вводной автомат 3P 25A</text>

    <rect x="20" y="100" width="180" height="35" rx="6" fill="#0f172a" stroke="#cbd5e1" stroke-width="1"/>
    <text x="110" y="122" fill="#f8fafc" font-size="11" font-weight="bold" text-anchor="middle">QD1: Селективное УЗО 300мА 40А</text>
  </g>

  <!-- Flow to Voltage Relays -->
  <path d="M 560 175 L 610 175" stroke="#64748b" stroke-width="3"/>

  <!-- Voltage Protection Relays -->
  <g transform="translate(610, 85)">
    <rect width="250" height="180" rx="10" fill="#1e293b" stroke="#e2e8f0" stroke-width="2"/>
    <text x="125" y="25" fill="#f8fafc" font-size="13" font-weight="bold" text-anchor="middle">РЕЛЕ КОНТРОЛЯ НАПРЯЖЕНИЯ</text>

    <!-- L1 Relay -->
    <rect x="15" y="40" width="220" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="25" y="58" fill="#fca5a5" font-size="11" font-weight="bold">РКН L1: фаза ~196В (у уставки Umin 195В)</text>
    <text x="25" y="72" fill="#f87171" font-size="10">На грани отключения по просадке</text>

    <!-- L2 Relay -->
    <rect x="15" y="85" width="220" height="38" rx="6" fill="#450a0a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="25" y="103" fill="#fca5a5" font-size="11" font-weight="bold">РКН L2: фаза ~195В (у уставки Umin 195В)</text>
    <text x="25" y="117" fill="#f87171" font-size="10">Тоже на грани отключения</text>

    <!-- L3 Relay -->
    <rect x="15" y="130" width="220" height="38" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <text x="25" y="148" fill="#6ee7b7" font-size="11" font-weight="bold">РКН L3: фаза ~218В (запас до Umax 250В)</text>
    <text x="25" y="162" fill="#34d399" font-size="10">В норме, недогружена по току</text>
  </g>

  <!-- Phase Distribution Busbars (3 Horizontal Branches) -->

  <!-- PHASE 1 BUS -->
  <g transform="translate(50, 310)">
    <rect width="1100" height="135" rx="10" fill="url(#l1Grad)" stroke="#ef4444" stroke-width="2"/>
    <rect x="10" y="10" width="250" height="115" rx="8" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
    <text x="20" y="32" fill="#f87171" font-size="14" font-weight="bold">ФАЗА 1 (L1) • 5 автоматов</text>
    <text x="20" y="55" fill="#fca5a5" font-size="12">Ток: 14.95 А | Мощность: 3054.9 Вт</text>
    <text x="20" y="75" fill="#fca5a5" font-size="12">Напряжение: 197.0 - 205.1 В</text>
    <text x="20" y="105" fill="#ef4444" font-size="11" font-weight="bold">Весь ток фазы — один котёл</text>

    <!-- Breakers L1 -->
    <g transform="translate(280, 15)">
      <!-- Kotel (heavy, only remaining real load on L1) -->
      <rect x="0" y="0" width="220" height="105" rx="6" fill="#7f1d1d" stroke="#f87171" stroke-width="2" filter="url(#glow)"/>
      <text x="10" y="24" fill="#fef2f2" font-size="11" font-weight="bold">3 АВТ (L1) 1тэн котла</text>
      <text x="10" y="44" fill="#fca5a5" font-size="13" font-weight="bold">14.85 A (49% от 30А)</text>
      <text x="10" y="64" fill="#fee2e2" font-size="11">205.1 В • 3052.2 Вт</text>
      <text x="10" y="88" fill="#f87171" font-size="10" font-weight="bold">t=42°C • единственная тяжёлая линия</text>

      <!-- Parkovka feeder (бывшая Скважина, перегрев) -->
      <rect x="235" y="0" width="195" height="105" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="2"/>
      <text x="245" y="24" fill="#fef3c7" font-size="11" font-weight="bold">Парковка (фидер, бывш. Скважина)</text>
      <text x="245" y="44" fill="#fde68a" font-size="11">0.09 A • уставка 20А</text>
      <text x="245" y="64" fill="#fde68a" font-size="11">198.6 В → Насос/красн.розетка (Щиток 3)</text>
      <text x="245" y="88" fill="#f59e0b" font-size="10" font-weight="bold">⚠️ t=43°C (протянуть клеммы)</text>

      <!-- Note: moved-away lines -->
      <rect x="445" y="0" width="340" height="105" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="455" y="24" fill="#f1f5f9" font-size="11" font-weight="bold">Переведены/перенесены с L1</text>
      <text x="455" y="45" fill="#cbd5e1" font-size="10">• Юля, Гардероб → L2 (см. фазу 2)</text>
      <text x="455" y="65" fill="#cbd5e1" font-size="10">• красная розетка, Насос → Щиток 3 (парковка)</text>
      <text x="455" y="90" fill="#38bdf8" font-size="10">• Роз Н, ИБП ГАЗ (бывш. Мишень) → Щиток 1, до АВР</text>
    </g>
  </g>

  <!-- PHASE 2 BUS -->
  <g transform="translate(50, 465)">
    <rect width="1100" height="135" rx="10" fill="url(#l2Grad)" stroke="#10b981" stroke-width="2"/>
    <rect x="10" y="10" width="250" height="115" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="1.5"/>
    <text x="20" y="32" fill="#6ee7b7" font-size="14" font-weight="bold">ФАЗА 2 (L2) • 11 автоматов</text>
    <text x="20" y="55" fill="#a7f3d0" font-size="12">Ток: 1.91 А | Мощность: 197.5 Вт</text>
    <text x="20" y="75" fill="#a7f3d0" font-size="12">Напряжение: 197.3 - 201.1 В</text>
    <text x="20" y="105" fill="#6ee7b7" font-size="11" font-weight="bold">Принял переведённые лёгкие линии</text>

    <!-- Breakers L2 -->
    <g transform="translate(280, 15)">
      <!-- Boiler/Water (main load) -->
      <rect x="0" y="0" width="190" height="105" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
      <text x="10" y="24" fill="#d1fae5" font-size="11" font-weight="bold">2 бойлер/скваж./очистка</text>
      <text x="10" y="44" fill="#a7f3d0" font-size="12" font-weight="bold">0.97 A (3% от 30А)</text>
      <text x="10" y="64" fill="#a7f3d0" font-size="11">199.7 В • 107.5 Вт</text>
      <text x="10" y="88" fill="#6ee7b7" font-size="10">t=41°C</text>

      <!-- Moved-in lines -->
      <rect x="205" y="0" width="250" height="105" rx="6" fill="#064e3b" stroke="#34d399" stroke-width="2"/>
      <text x="215" y="24" fill="#d1fae5" font-size="11" font-weight="bold">Переведены владельцем на L2</text>
      <text x="215" y="44" fill="#a7f3d0" font-size="10">• Юля (0A) • Гардероб (0.30A)</text>
      <text x="215" y="64" fill="#a7f3d0" font-size="10">• Кухня (0.07A, возвращена с L3)</text>
      <text x="215" y="88" fill="#6ee7b7" font-size="10">Бойлер ГВС (L2-16): ожидание</text>

      <!-- Rooms summary -->
      <rect x="470" y="0" width="330" height="105" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="480" y="24" fill="#e2e8f0" font-size="11" font-weight="bold">Комнаты и свет L2</text>
      <text x="480" y="44" fill="#94a3b8" font-size="10">• Холл 0.17A • Спальня 0.20A • Туалет 0A</text>
      <text x="480" y="62" fill="#94a3b8" font-size="10">• Гостиная 0.18A • Мелания 0.04A</text>
      <text x="480" y="90" fill="#6ee7b7" font-size="10">Почти все в режиме ожидания на момент замера</text>
    </g>
  </g>

  <!-- PHASE 3 BUS -->
  <g transform="translate(50, 620)">
    <rect width="1100" height="135" rx="10" fill="url(#l3Grad)" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="10" y="10" width="250" height="115" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="20" y="32" fill="#c084fc" font-size="14" font-weight="bold">ФАЗА 3 (L3) • 2 автомата</text>
    <text x="20" y="55" fill="#e9d5ff" font-size="12">Ток: 0.41 А | Мощность: 93.7 Вт</text>
    <text x="20" y="75" fill="#e9d5ff" font-size="12">Напряжение: 229.9 В</text>
    <text x="20" y="105" fill="#d8b4fe" font-size="11">НЕДОГРУЖЕНА — свободна для переноса нагрузки</text>

    <!-- Breakers L3 -->
    <g transform="translate(280, 15)">
      <!-- Plita -->
      <rect x="0" y="0" width="260" height="105" rx="6" fill="#2e1065" stroke="#c084fc" stroke-width="1.5"/>
      <text x="10" y="24" fill="#faf5ff" font-size="11" font-weight="bold">1 АВТ (L3) 2 тен котла плита</text>
      <text x="10" y="44" fill="#e9d5ff" font-size="12">0.41 A (1% от 36А)</text>
      <text x="10" y="64" fill="#e9d5ff" font-size="11">229.9 В • t=39°C</text>
      <text x="10" y="88" fill="#c084fc" font-size="10">Единственная линия на фазе</text>

      <!-- Note: Kitchen and Roz V moved away -->
      <rect x="290" y="0" width="340" height="105" rx="6" fill="#1e293b" stroke="#475569" stroke-width="1"/>
      <text x="300" y="24" fill="#e2e8f0" font-size="11" font-weight="bold">Перенесены с L3</text>
      <text x="300" y="45" fill="#94a3b8" font-size="10">• Кухня → вернулась на L2 (см. фазу 2)</text>
      <text x="300" y="65" fill="#94a3b8" font-size="10">• Роз В → Щиток 1, до АВР (не на этой шине)</text>
    </g>
  </g>
</svg>
